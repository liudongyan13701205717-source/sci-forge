name: 功能请求
description: 提出新功能或对现有能力的改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请尽量说清「要解决什么问题」，而不只是「想加什么功能」——这会显著提高被采纳的概率。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在当前流程中遇到的困难；什么情况下这件事会变成瓶颈
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你设想的使用方式。若涉及 MCP 工具，请给出工具名与参数草案
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - MCP 工具（新增或修改）
        - 学科 registry
        - 科学数据连接器
        - 写作 / 导出
        - 复现线
        - 评审核验线
        - 桌面版联动（sciforge-desktop）
        - 文档 / 示例
        - 工程与 CI
        - 其他
    validations:
      required: true

  - type: dropdown
    id: contract-impact
    attributes:
      label: 是否会改变 MCP 契约
      description: 改动工具签名、工具语义、返回结构、学科字段或 `.sci-forge` 存储布局即属于改变契约
      multiple: false
      options:
        - 是 —— 涉及 MCP 契约，按约定需在 sci-forge-desktop 同步
        - 否 —— 不涉及 MCP 契约
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括你尝试过的绕行方式
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue 与 Discussions，没有相同请求
          required: true
        - label: 我愿意就此建议提交 PR
          required: false
